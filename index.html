
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Countdown | Minimal & Bright</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f97316;
            --secondary: #db2777;
            --accent: #fcd34d;
        }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: #ffffff;
            color: #1e293b;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.8s ease;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        
        .text-shimmer {
            background: linear-gradient(
                to right, 
                #f97316 20%, 
                #fcd34d 40%, 
                #fb923c 60%, 
                #db2777 80%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }
        
        @keyframes shine {
            to { background-position: 200% center; }
        }

        .celebration-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(249, 115, 22, 0.1);
            position: relative;
            overflow: hidden;
        }

        @keyframes float-up {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-120vh) scale(1.5) rotate(360deg); opacity: 0; }
        }
        .particle {
            position: absolute;
            pointer-events: none;
            animation: float-up linear infinite;
            filter: blur(1px);
        }

        .animate-reveal {
            animation: reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }
        @keyframes reveal {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes heartbeat {
            0% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(249,115,22,0)); }
            15% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(249,115,22,0.4)); }
            30% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(249,115,22,0)); }
            45% { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(249,115,22,0.5)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(249,115,22,0)); }
        }
        .heartbeat-anim {
            animation: heartbeat 1s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        @keyframes heartbeat-fast {
            0% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(239,68,68,0)); }
            15% { transform: scale(1.15); filter: drop-shadow(0 0 40px rgba(239,68,68,0.6)); }
            30% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(239,68,68,0)); }
            45% { transform: scale(1.2); filter: drop-shadow(0 0 50px rgba(239,68,68,0.7)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(239,68,68,0)); }
        }
        .heartbeat-fast-anim {
            animation: heartbeat-fast 0.6s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        @keyframes rotate-glow {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .intense-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: conic-gradient(from 0deg, transparent, rgba(251,146,60,0.4), transparent, rgba(219,39,119,0.4), transparent);
            animation: rotate-glow 6s linear infinite;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; background-color: rgba(254, 215, 170, 0.2); }
        }
        .urgent-bg {
            animation: flash 0.8s infinite;
        }

        @keyframes burst {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(4); opacity: 0; }
        }
        .celebrate-burst {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #fb923c, #db2777, transparent);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: burst 1s ease-out forwards;
        }
    </style>
